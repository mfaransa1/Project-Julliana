{% if values %}
  <ul class="list-group list-group-flush">
  {% for label, count in values %}
    <li class="list-group-item d-flex justify-content-between align-items-center px-0"><span>{{ label or 'Unspecified' }}</span><span class="badge text-bg-secondary rounded-pill">{{ count }}</span></li>
  {% endfor %}
  </ul>
{% else %}
  <p class="text-muted mb-0">No metrics yet.</p>
{% endif %}
